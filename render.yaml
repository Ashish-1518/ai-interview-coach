# Render Blueprint — Infrastructure as Code
# https://docs.render.com/infrastructure-as-code
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Go to https://dashboard.render.com → New → Blueprint.
#   3. Connect the repo — Render reads this file and provisions everything.

databases:
  - name: ai-interview-coach-db
    plan: free
    databaseName: interview_coach
    user: interview_coach

services:
  # ── Backend (FastAPI) ────────────────────────────────────────────────────
  - type: web
    name: ai-interview-coach-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-coach-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: WARNING
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: STORAGE_DIR
        value: /app/storage
      - key: MAX_RESUME_UPLOAD_SIZE_MB
        value: "5"
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_KEY
        sync: false  # set manually in dashboard
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: AI_TIMEOUT_SECONDS
        value: "30"
      - key: BACKEND_CORS_ORIGINS
        value: https://ai-interview-coach-frontend.onrender.com

  # ── Frontend (React SPA via static site) ─────────────────────────────────
  - type: web
    name: ai-interview-coach-frontend
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ai-interview-coach-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
